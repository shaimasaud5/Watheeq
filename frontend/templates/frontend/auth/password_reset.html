{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>نسيت كلمة المرور — وثيق</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --ink:#1A2E4A;--blue:#1A5FAA;--bm:#2D7DD2;--bl:#EAF3FF;
  --w:#FFFFFF;--paper:#F6F9FF;--rule:#D8E8F8;--muted:#6B87A8;
  --display:'DM Serif Display',serif;--body:'Cairo',sans-serif;
  --error:#EF4444;
}
body{font-family:var(--body);background:var(--paper);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;}
.top-logo{position:fixed;top:1.5rem;right:2rem;}
.top-logo img{height:60px;width:auto;filter:invert(25%) sepia(50%) saturate(500%) hue-rotate(190deg) brightness(0.75);}
.card{background:var(--w);border:1px solid var(--rule);border-radius:20px;padding:3rem 2.5rem;width:100%;max-width:440px;box-shadow:0 4px 32px rgba(26,47,74,0.06);}
.icon-wrap{width:56px;height:56px;background:var(--bl);border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 1.5rem;}
.icon-wrap svg{width:26px;height:26px;color:var(--bm);}
.card-title{font-family:var(--display);font-size:1.8rem;color:var(--ink);text-align:center;margin-bottom:0.6rem;}
.card-sub{font-size:13px;color:var(--muted);text-align:center;line-height:1.8;margin-bottom:2rem;}
.field{margin-bottom:1.2rem;text-align:right;}
.form-label{display:block;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:5px;}
.required-star{color:var(--error);margin-left:2px;}
.form-input{width:100%;height:46px;border:1.5px solid var(--rule);border-radius:100px;padding:0 18px;font-size:14px;font-family:var(--body);color:var(--ink);background:var(--w);outline:none;transition:border-color 0.2s;}
.form-input:focus{border-color:var(--bm);box-shadow:0 0 0 3px rgba(45,125,210,0.1);}
.form-input.input-error{border-color:var(--error);}
.field-error{display:block;font-size:12px;color:var(--error);margin-top:4px;padding-right:4px;}
.btn-primary{display:block;width:100%;height:46px;margin-top:0.5rem;background:var(--bm);color:#fff;font-family:var(--body);font-size:15px;font-weight:600;border-radius:100px;border:none;cursor:pointer;transition:background 0.2s;}
.btn-primary:hover{background:var(--blue);}
.back-link{text-align:center;font-size:13px;color:var(--muted);margin-top:1.2rem;}
.back-link a{color:var(--bm);text-decoration:none;font-weight:600;}
.back-link a:hover{text-decoration:underline;}
</style>
</head>
<body>
<div class="top-logo">
  <a href="{% url 'frontend:landing' %}"><img src="{% static 'img/logo.png' %}" alt="وثيق"/></a>
</div>
<div class="card">
  <div class="icon-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="4" width="20" height="16" rx="3"/><path d="M2 7l10 7 10-7"/>
    </svg>
  </div>
  <div class="card-title">نسيت كلمة المرور؟</div>
  <div class="card-sub">لا تقلق! أدخل بريدك الإلكتروني وسنرسل لك<br>رابطاً لإعادة تعيين كلمة المرور.</div>
  <form method="post" novalidate>
    {% csrf_token %}
    <div class="field">
      <label class="form-label" for="id_email"><span class="required-star">*</span> البريد الإلكتروني</label>
      <input type="email" id="id_email" name="email"
        class="form-input {% if form.email.errors %}input-error{% endif %}"
        placeholder="sara@example.com"
        value="{{ form.email.value|default:'' }}" autocomplete="email">
      {% if form.email.errors %}<span class="field-error">{{ form.email.errors.0 }}</span>{% endif %}
    </div>
    <button type="submit" class="btn-primary">إرسال رابط الاسترداد ←</button>
  </form>
  <div class="back-link"><a href="{% url 'frontend:login' %}">← العودة لتسجيل الدخول</a></div>
</div>
</body>
</html>
