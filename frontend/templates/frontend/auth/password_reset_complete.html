{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>تم التغيير — وثيق</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --ink:#1A2E4A;--blue:#1A5FAA;--bm:#2D7DD2;--bl:#EAF3FF;
  --w:#FFFFFF;--paper:#F6F9FF;--rule:#D8E8F8;--muted:#6B87A8;
  --display:'DM Serif Display',serif;--body:'Cairo',sans-serif;
}
body{font-family:var(--body);background:var(--paper);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;}
.top-logo{position:fixed;top:1.5rem;right:2rem;}
.top-logo img{height:60px;width:auto;filter:invert(25%) sepia(50%) saturate(500%) hue-rotate(190deg) brightness(0.75);}
.card{background:var(--w);border:1px solid var(--rule);border-radius:20px;padding:3rem 2.5rem;width:100%;max-width:440px;box-shadow:0 4px 32px rgba(26,47,74,0.06);text-align:center;}
.icon-wrap{width:72px;height:72px;background:#DCFCE7;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 1.5rem;}
.icon-wrap svg{width:34px;height:34px;color:#16A34A;}
.card-title{font-family:var(--display);font-size:1.9rem;color:var(--ink);margin-bottom:0.8rem;}
.card-sub{font-size:13px;color:var(--muted);line-height:2;margin-bottom:2rem;}
.btn-primary{display:block;width:100%;height:46px;background:var(--bm);color:#fff;font-family:var(--body);font-size:15px;font-weight:600;border-radius:100px;border:none;cursor:pointer;transition:background 0.2s;text-decoration:none;line-height:46px;}
.btn-primary:hover{background:var(--blue);}
</style>
</head>
<body>
<div class="top-logo">
  <a href="{% url 'frontend:landing' %}"><img src="{% static 'img/logo.png' %}" alt="وثيق"/></a>
</div>
<div class="card">
  <div class="icon-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"/>
    </svg>
  </div>
  <div class="card-title">تم تغيير كلمة المرور!</div>
  <div class="card-sub">
    كلمة مرورك الجديدة جاهزة.<br>
    يمكنك الآن تسجيل الدخول بكلمة المرور الجديدة.
  </div>
  <a class="btn-primary" href="{% url 'frontend:login' %}">تسجيل الدخول ←</a>
</div>
</body>
</html>
